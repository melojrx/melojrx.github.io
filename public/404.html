<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecionando...</title>
    <script>
      // Preserva a rota para SPA no GitHub Pages (user site - base '/')
      // Salva o path atual no sessionStorage e redireciona para a raiz
      var l = window.location;
      sessionStorage.redirect = l.pathname + l.search + l.hash;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
    </script>
  </head>
  <body>
    Redirecionando...
  </body>
</html>
